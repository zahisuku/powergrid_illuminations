architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

      // Sable Companion
    maven {
        name = "RyanHCode"
        url = "https://maven.ryanhcode.dev/releases"
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // PowerGrid
    modImplementation "maven.modrinth:eWiBLJ9R:ip4gJrgx"

    // 1.21.1 NeoForge 用 Create
    // 依存関係（Ponder/Flywheel等）が自動的に取得されます
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    
    modLocalRuntime(
        "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:1.6.0"
    )

        // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // テスト実行エンジン
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly "org.ejml:ejml-core:0.44.0"
    compileOnly "org.ejml:ejml-simple:0.44.0"
    compileOnly "org.ejml:ejml-ddense:0.44.0"
    compileOnly "org.ejml:ejml-dsparse:0.44.0"

    // JUnit 実行時に EJML を読み込む
    testRuntimeOnly "org.ejml:ejml-core:0.44.0"
    testRuntimeOnly "org.ejml:ejml-simple:0.44.0"
    testRuntimeOnly "org.ejml:ejml-ddense:0.44.0"
    testRuntimeOnly "org.ejml:ejml-dsparse:0.44.0"
}
